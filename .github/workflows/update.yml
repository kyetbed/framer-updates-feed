name: Update Framer RSS

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_url:
        description: "Optional existing Framer update URL to send as a test webhook"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: framer-updates-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch updates and send notifications
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_URL: ${{ inputs.test_url }}
        run: python update_feed.py
      - name: Save feed and heartbeat
        if: ${{ !inputs.test_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rss.xml heartbeat.txt
          git diff --cached --quiet || (git commit -m "Update Framer RSS feed" && git push)
